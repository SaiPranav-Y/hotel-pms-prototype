[pytest]
# Run from the voice-agent/ directory. `pythonpath = .` makes the `app`
# package importable without installing it.
pythonpath = .
testpaths = tests
# -p no:cacheprovider avoids a Windows "Access is denied" warning when pytest
# tries to write .pytest_cache under the workspace path with a space in it.
addopts = -q -p no:cacheprovider
