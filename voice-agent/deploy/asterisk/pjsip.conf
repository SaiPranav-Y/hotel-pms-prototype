; ---------------------------------------------------------------------------
; pjsip.conf — TEMPLATE for the Telugu voice agent dev setup (Asterisk + SIP).
;
; This registers ONE local SIP endpoint ("softphone") you can dial FROM using a
; free softphone (Zoiper / Linphone / MicroSIP) over your LAN. No carrier, no
; phone number, no cost. Replace the CHANGE_ME secret before use.
;
; This is a starting point, not a hardened production config. See
; docs/TELEPHONY.md.
; ---------------------------------------------------------------------------

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; ---- The softphone you register from ----
[softphone]
type = endpoint
context = agent-inbound          ; dialplan context in extensions.conf
disallow = all
allow = ulaw                     ; 8 kHz; the adapter resamples to 16 kHz for STT
allow = alaw
auth = softphone-auth
aors = softphone

[softphone-auth]
type = auth
auth_type = userpass
username = softphone
password = CHANGE_ME             ; <-- set a real secret; keep it out of git

[softphone]
type = aor
max_contacts = 1
