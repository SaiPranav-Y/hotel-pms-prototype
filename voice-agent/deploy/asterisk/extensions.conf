; ---------------------------------------------------------------------------
; extensions.conf — TEMPLATE dialplan for the Telugu voice agent.
;
; When the softphone dials extension 1000, Asterisk hands the call's audio to
; the agent app via AudioSocket (raw PCM over TCP). Implement
; AsteriskTelephony(TelephonyAdapter) to accept that stream, run it through
; STT -> DialogueSession -> TTS, and stream Telugu audio back.
;
; AudioSocket requires the app to listen on TCP 127.0.0.1:9000 (example).
; The UUID identifies the call leg. See docs/TELEPHONY.md.
; ---------------------------------------------------------------------------

[agent-inbound]
; Dial 1000 to reach the Telugu voice agent.
exten => 1000,1,Answer()
 same => n,Verbose(1, "Inbound call to Telugu voice agent from ${CALLERID(num)}")
 ; Hand the media to our app over AudioSocket. The first arg is a call UUID.
 same => n,AudioSocket(${UUID},127.0.0.1:9000)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Alternative: ARI externalMedia (if you prefer the REST/WebSocket approach).
; Stasis() routes the call to an ARI application named "telugu-agent" that your
; adapter connects to over the ARI WebSocket.
; ---------------------------------------------------------------------------
; exten => 1000,1,Answer()
;  same => n,Stasis(telugu-agent)
;  same => n,Hangup()
